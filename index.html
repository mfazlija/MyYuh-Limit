<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Optimisation Viewport pour occuper 100% de l'écran (y compris sous l'encoche des iPhone) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Balises PWA pour un rendu d'application native si ajoutée à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFFFFF">
    
    <title>Mon Budget Journalier</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF; /* Light theme background */
            color: #1A1A1A; /* Dark text */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for webkit to keep it clean */
        ::-webkit-scrollbar {
            width: 0px;
        }

        /* Yuh inspired orange/coral accent */
        .yuh-accent {
            color: #FF5421; /* Yuh vibrant coral/orange */
        }
        .yuh-bg-accent {
            background-color: #FF5421;
        }
        
        /* Remove arrows from number input */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Smooth transition for the calculated number */
        .value-transition {
            transition: all 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<!-- Le body s'adapte à 100% de la hauteur dynamique (100dvh) et devient blanc sur mobile -->
<body class="min-h-[100dvh] flex justify-center items-start sm:items-center bg-white sm:bg-gradient-to-b sm:from-[#F5F3F8] sm:to-[#FFFFFF] text-[#1A1A1A] antialiased">

    <!-- La div main s'étire sur tout l'écran sur mobile, mais redevient une carte sur ordinateur (sm:...) -->
    <main 
        class="w-full max-w-md bg-white sm:rounded-[2.5rem] px-5 sm:p-8 shadow-none sm:shadow-[0_8px_30px_rgb(0,0,0,0.08)] relative overflow-x-hidden overflow-y-auto sm:border border-[#EBE8F0] min-h-[100dvh] sm:min-h-fit flex flex-col"
        style="padding-top: max(2rem, env(safe-area-inset-top)); padding-bottom: max(2rem, env(safe-area-inset-bottom));"
    >
        
        <!-- Header Section -->
        <header class="mb-8 text-center mt-2 sm:mt-0">
            <h1 class="text-3xl tracking-tight mb-1 text-[#1A1A1A]">
                My<span class="yuh-accent font-black lowercase text-4xl">yuh</span> <span class="font-bold">Limit</span>
            </h1>
            <p id="currentDateDisplay" class="text-[#666666] text-sm font-medium capitalize"></p>
            <span id="saveStatus" class="text-xs text-[#999999] mt-1 inline-block"></span>
        </header>

        <section class="bg-[#F8F7FA] p-6 rounded-[2rem] mb-4 border border-[#EBE8F0]">
            <label for="balanceInput" class="block text-sm font-medium text-[#666666] mb-3">
                Solde actuel sur le compte
            </label>
            <div class="flex items-center">
                <span class="text-2xl font-bold text-[#666666] mr-2">CHF</span>
                <input 
                    type="number" 
                    id="balanceInput" 
                    inputmode="decimal"
                    class="w-full bg-transparent text-4xl sm:text-5xl font-black outline-none text-[#1A1A1A] placeholder-[#C4C4C4]" 
                    placeholder="0.00"
                >
            </div>

            <div id="transactionsContainer" class="mt-4 flex flex-col gap-3"></div>
            
            <button id="addTransactionBtn" class="mt-4 w-full py-3 rounded-2xl border border-dashed border-[#D1D1D6] text-[#666666] font-medium hover:text-[#FF5421] hover:border-[#FF5421] hover:bg-[#FFF2F0] transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Ajouter débit / crédit
            </button>
        </section>

        <!-- La classe 'mt-auto' repousse automatiquement cette zone tout en bas de l'écran du téléphone -->
        <section class="mt-auto bg-[#F8F7FA] p-6 rounded-[2rem] border border-[#EBE8F0] relative overflow-hidden flex flex-col items-center justify-center min-h-[180px] shrink-0">
            <!-- Top accent bar -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#FF5421] to-[#FFA07A]"></div>
            
            <p class="text-sm font-medium text-[#666666] mb-2 text-center">
                Tu peux dépenser environ
            </p>
            
            <div class="flex items-baseline mb-2 value-transition" id="resultContainer">
                <span id="dailyBudget" class="text-6xl font-black yuh-accent tracking-tighter">0.00</span>
            </div>
            
            <p class="text-[#1A1A1A] text-lg font-bold mb-6">CHF / jour</p>
            
            <div class="bg-white border border-[#EBE8F0] px-4 py-2 rounded-full flex items-center shadow-sm">
                <svg class="w-4 h-4 text-[#666666] mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p id="daysLeftDisplay" class="text-xs font-medium text-[#666666]"></p>
            </div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuration Firebase & Identifiants
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'my-yuh-limit';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo-project"
        };

        let db = null;
        let auth = null;
        let user = null;
        let saveTimeout = null;

        // Dépenses récurrentes configurées
        const RECURRING_EXPENSES = [
            { day: 1, amount: -33.90, label: "Youtube Premium" },
            { day: 6, amount: -17.00, label: "Google One" },
            { day: 13, amount: -75.00, label: "Wingo" },
            { day: 15, amount: -25.95, label: "Tidal" },
            { day: 17, amount: -12.99, label: "Tesla" }
        ];

        let dismissedRecurringIds = new Set();
        let remainingDays = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const balanceInput = document.getElementById('balanceInput');
            const dailyBudgetDisplay = document.getElementById('dailyBudget');
            const currentDateDisplay = document.getElementById('currentDateDisplay');
            const daysLeftDisplay = document.getElementById('daysLeftDisplay');
            const resultContainer = document.getElementById('resultContainer');
            const saveStatus = document.getElementById('saveStatus');

            function initDateLogic() {
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const currentDay = today.getDate();

                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                currentDateDisplay.textContent = today.toLocaleDateString('fr-CH', options);

                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const targetDay = lastDayOfMonth - 1;

                remainingDays = targetDay - currentDay + 1;
                if (remainingDays <= 0) remainingDays = 1;

                const formattedTargetDate = `${String(targetDay).padStart(2, '0')}.${String(month + 1).padStart(2, '0')}.${year}`;
                daysLeftDisplay.textContent = `${remainingDays} jour${remainingDays > 1 ? 's' : ''} restants (jusqu'au ${formattedTargetDate})`;
            }

            function formatCHF(number) {
                return number.toLocaleString('fr-CH', { 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                });
            }

            function updateCalculation() {
                const balanceStr = balanceInput.value.replace(',', '.');
                let totalBalance = parseFloat(balanceStr);

                if (isNaN(totalBalance)) {
                    totalBalance = 0;
                }

                // Totalise toutes les lignes de transactions
                const transactionInputs = document.querySelectorAll('.transaction-input');
                transactionInputs.forEach(input => {
                    const valStr = input.value.replace(',', '.');
                    const val = parseFloat(valStr);
                    if (!isNaN(val)) {
                        totalBalance += val;
                    }
                });

                resultContainer.style.transform = 'scale(0.97)';
                setTimeout(() => {
                    resultContainer.style.transform = 'scale(1)';
                }, 100);

                if (totalBalance <= 0) {
                    dailyBudgetDisplay.textContent = "0.00";
                } else {
                    const dailyBudget = totalBalance / remainingDays;
                    dailyBudgetDisplay.textContent = formatCHF(dailyBudget);
                }

                triggerAutoSave();
            }

            function addTransactionRow(val = '', label = '', isRecurring = false, recurringDay = null) {
                const container = document.getElementById('transactionsContainer');
                const row = document.createElement('div');
                row.className = 'flex items-center bg-white rounded-2xl p-3 border border-[#EBE8F0] shadow-sm animate-fade-in gap-2';
                
                if (isRecurring && recurringDay) {
                    row.dataset.recurringDay = recurringDay;
                }

                row.innerHTML = `
                    <div class="flex-1 flex flex-col">
                        ${label ? `<span class="text-[10px] uppercase font-bold text-[#FF5421] tracking-wider mb-0.5">${label}</span>` : ''}
                        <div class="flex items-center">
                            <span class="text-[#666666] font-bold mr-2 text-lg">CHF</span>
                            <input 
                                type="number" 
                                inputmode="decimal"
                                class="transaction-input w-full bg-transparent text-xl font-bold outline-none text-[#1A1A1A] placeholder-[#C4C4C4]" 
                                placeholder="+ ou - 0.00"
                                value="${val}"
                            >
                        </div>
                    </div>
                    <button class="remove-btn p-2 text-[#666666] hover:text-[#FF3B30] transition-colors rounded-full hover:bg-[#F8F7FA]" title="Supprimer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;

                const input = row.querySelector('.transaction-input');
                input.addEventListener('input', updateCalculation);

                const removeBtn = row.querySelector('.remove-btn');
                removeBtn.addEventListener('click', () => {
                    if (isRecurring && recurringDay) {
                        dismissedRecurringIds.add(recurringDay);
                    }
                    row.remove();
                    updateCalculation();
                });

                container.appendChild(row);
                return input;
            }

            function checkAndPopulateRecurring() {
                const today = new Date();
                const currentDay = today.getDate();

                RECURRING_EXPENSES.forEach(exp => {
                    // Si la date est aujourd'hui ou dans le futur ce mois-ci
                    if (currentDay <= exp.day) {
                        // Et si l'utilisateur ne l'a pas supprimée manuellement
                        if (!dismissedRecurringIds.has(exp.day)) {
                            // Vérifie si la ligne existe déjà dans l'UI
                            const exists = document.querySelector(`[data-recurring-day="${exp.day}"]`);
                            if (!exists) {
                                addTransactionRow(exp.amount, exp.label, true, exp.day);
                            }
                        }
                    }
                });
            }

            async function initCloudStorage() {
                try {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    user = auth.currentUser;
                    if (!user) return;

                    saveStatus.textContent = "● Synchro activée";

                    // Charger les données sauvegardées
                    const userId = user.uid;
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'budgetData', 'state');
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.balance !== undefined) {
                            balanceInput.value = data.balance;
                        }

                        if (data.dismissedRecurring) {
                            dismissedRecurringIds = new Set(data.dismissedRecurring);
                        }

                        // Appliquer les dépenses récurrentes d'abord
                        checkAndPopulateRecurring();

                        // Charger les transactions manuelles sauvegardées
                        if (data.customTransactions && Array.isArray(data.customTransactions)) {
                            data.customTransactions.forEach(t => {
                                addTransactionRow(t.val, t.label || '');
                            });
                        }
                    } else {
                        checkAndPopulateRecurring();
                    }

                    updateCalculation();

                } catch (e) {
                    console.log("Fiestore offline/disabled, fallback local session:", e);
                    checkAndPopulateRecurring();
                    updateCalculation();
                }
            }

            function triggerAutoSave() {
                if (!user || !db) return;

                saveStatus.textContent = "Sauvegarde...";
                clearTimeout(saveTimeout);

                saveTimeout = setTimeout(async () => {
                    try {
                        const customTransactions = [];
                        const rows = document.querySelectorAll('#transactionsContainer > div');
                        rows.forEach(row => {
                            // Ne sauvegarde que les transactions manuelles (non récurrentes)
                            if (!row.dataset.recurringDay) {
                                const input = row.querySelector('.transaction-input');
                                if (input && input.value) {
                                    customTransactions.push({ val: input.value });
                                }
                            }
                        });

                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'budgetData', 'state');
                        await setDoc(docRef, {
                            balance: balanceInput.value,
                            dismissedRecurring: Array.from(dismissedRecurringIds),
                            customTransactions: customTransactions,
                            updatedAt: new Date().toISOString()
                        });

                        saveStatus.textContent = "● Données enregistrées";
                    } catch (e) {
                        saveStatus.textContent = "● Mode local";
                    }
                }, 800);
            }

            // Event Listeners
            balanceInput.addEventListener('input', updateCalculation);
            document.getElementById('addTransactionBtn').addEventListener('click', () => {
                const newInput = addTransactionRow();
                newInput.focus();
            });

            // Lancement
            initDateLogic();
            await initCloudStorage();
        });
    </script>
</body>
</html>
